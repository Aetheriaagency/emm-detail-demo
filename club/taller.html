  function vistaClub() {
    const E = st(), cfg = E.config;
    const niveles = EMM.NIVELES.map((n, i) => {
      const cuantos = E.socios.filter((s) => EMM.nivel(s) === n).length, sig = EMM.NIVELES[i + 1];
      return `<div class="nivel-c" style="--c:${n.color}"><div class="entre"><b class="nivel-n">${n.n}</b><span class="peq mut">${plural(cuantos, "socio", "socios")}</span></div>
        <div class="nivel-r">${sig ? `De ${n.desde} a ${sig.desde - 1} puntos` : `Desde ${n.desde} puntos`}</div>
        <div class="nivel-d">${n.dto ? `${n.dto} %` : "0 %"}<small>${n.dto ? "de descuento" : "sin descuento"}</small></div>
        <ul>${n.ventajas.map((v) => `<li>${esc(v)}</li>`).join("")}</ul></div>`;
    }).join("");
    return `<div class="dos club">
      <div class="pila">
        <div class="card"><div class="card-c"><h2>Cómo funciona el club</h2></div>
          <div class="reglas">
            <div class="regla"><b>${cfg.puntosPorEuro} punto</b><span>por cada euro gastado</span></div>
            <div class="regla"><b>${esc(cfg.horasSocio.join(" y "))}</b><span>horas reservadas a socios</span></div>
            <div class="regla"><b>15 min</b><span>dura el código de canje</span></div>
          </div>
          <div class="niveles">${niveles}</div>
          <p class="peq mut">El nivel va por puntos acumulados: canjear puntos no hace bajar de nivel.</p></div>
        <div class="card"><div class="card-c"><h2>Monedero y bono de recarga</h2></div>
          <p class="mut peq" style="margin-bottom:12px">El socio recarga saldo y le regalamos un porcentaje. El saldo se gasta en el taller y no se devuelve en efectivo.</p>
          <div class="fila bono"><div class="pct"><input type="number" id="bono" min="0" max="50" step="1" value="${cfg.bonoRecarga}" aria-label="Bono de recarga"><span>%</span></div>
            <button class="btn btn-blue btn-sm" data-acc="guardarBono">Guardar</button><span class="mut peq" id="bonoEj">Si recarga 50 €, recibe ${eur((50 * cfg.bonoRecarga) / 100)} de regalo.</span></div></div>
        <div class="card"><div class="card-c"><h2>Recompensas</h2><span class="mut peq">Se canjean desde la app</span></div>
          ${E.recompensas.map((r) => `<div class="rec"><span class="av-i oferta">${svg(IC.regalo)}</span><div><b>${esc(r.n)}</b><div class="mut peq">Vale ${eur(r.valor)}</div></div><span class="chip azul">${r.puntos} puntos</span></div>`).join("")}</div>
      </div>
      <div class="pila">
        <div class="card"><div class="card-c"><h2>Enviar oferta a los socios</h2><span class="chip azul">${plural(E.socios.length, "socio", "socios")}</span></div>
          <textarea id="ofTexto" rows="4" maxlength="240" placeholder="Escribe la oferta o elige una plantilla…"></textarea>
          <div class="entre" style="margin-top:10px"><div class="plantillas">${PLANTILLAS.map((p, i) => `<button type="button" class="chip" data-acc="plantilla" data-i="${i}">${esc(p.n)}</button>`).join("")}</div><span class="peq mut" id="ofCont">0/240</span></div>
          <div class="noti"><span class="noti-i"><b>EMM</b></span><div style="min-width:0"><b>EMM Detail</b><small>ahora</small><p id="ofPrev"></p></div></div>
          <button class="btn btn-blue" style="width:100%" data-acc="enviarOferta">${svg(IC.movil, "ic")} Enviar a ${plural(E.socios.length, "socio", "socios")}</button></div>
        <div class="card"><div class="card-c"><h2>Ofertas enviadas</h2><span class="mut peq">${E.ofertas.length}</span></div>
          ${E.ofertas.length ? E.ofertas.map((o) => `<div class="of"><small>${esc(fechaHora(o.fecha))}</small><div>${esc(o.texto)}</div></div>`).join("") : '<div class="vacio">Todavía no has enviado ninguna.</div>'}</div>
      </div></div>`;
  }
  function previaOferta() {
    const t = $("#ofTexto"), p = $("#ofPrev");
    if (!t || !p) return;
    p.textContent = t.value.trim() || "Así les llegará el aviso en el móvil.";
    p.style.color = t.value.trim() ? "" : "var(--mut)";
    $("#ofCont").textContent = `${t.value.length}/240`;
  }

  /* ───────── 7. Caja e informes ───────── */
  function vistaCaja() {
    const E = st(), cj = EMM.caja(), inf = EMM.informe(30);
    const formas = Object.entries(cj.formas);
    const maxF = Math.max(1, ...formas.map((f) => f[1]));
    const tickets = cj.tickets.slice().sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
    const dias = Object.entries(inf.porDia);
    const max = Math.max(1, ...dias.map((d) => d[1]));
    const tope = Math.ceil(max / 100) * 100;
    const servicios = Object.entries(inf.porServicio).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const maxS = Math.max(1, ...servicios.map((s) => s[1]));
    const concepto = (t) => t.lineas.map((l) => l.n + (l.cant > 1 ? ` ×${l.cant}` : "")).join(", ");
    return `
      <div class="dos" style="margin-bottom:16px">
        <div class="card"><div class="card-c"><h2>Caja de hoy</h2><span class="mut peq">${plural(cj.tickets.length, "cobro", "cobros")}</span></div>
          <div class="caja-total">${eur(cj.total)}</div>
          ${formas.map(([f, v]) => `<div class="forma"><span>${esc(FORMAS[f] || mayus(f))}</span><span class="barra"><i style="width:${(v / maxF) * 100}%"></i></span><b class="der">${eur(v)}</b></div>`).join("")}</div>
        <div class="card sin-p"><div class="card-c"><h2>Cobros de hoy</h2><a href="#caja" class="enl" style="pointer-events:none">En directo desde el TPV</a></div>
          ${tickets.length ? `<div style="overflow-x:auto;max-height:260px;margin-top:6px"><table class="tabla compacta"><thead><tr><th>Hora</th><th>Cliente y concepto</th><th class="der">Total</th></tr></thead><tbody>
            ${tickets.map((t) => `<tr><td><b>${esc(EMM.horaDe(t.fecha))}</b><span class="sub">Nº ${t.num}</span></td><td style="max-width:240px"><b>${esc(t.socioId ? (EMM.socio(t.socioId) || {}).nombre || "Socio" : "Cliente sin cuenta")}</b><span class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(concepto(t))}</span></td><td class="der"><b>${eur(t.total)}</b><span class="sub">${Object.keys(t.pagos).map((f) => esc(FORMAS[f] || f)).join(" + ")}</span></td></tr>`).join("")}</tbody></table></div>`
            : `<div class="vacio">Aún no hay cobros hoy. Lo que se cobre en el TPV aparece aquí al momento.</div>`}</div>
      </div>
      <div class="mini-kpis">
        <div class="mk"><span>Facturado en 30 días</span><b>${eur(inf.total)}</b></div>
        <div class="mk"><span>Tickets</span><b>${inf.tickets}</b></div>
        <div class="mk"><span>Ticket medio</span><b>${eur(inf.medio)}</b></div>
        <div class="mk" style="display:flex;align-items:center;gap:14px"><div class="anillo" style="--p:${inf.pctSocios}"></div><div><span>Ventas de socios</span><b>${inf.pctSocios} %</b></div></div>
      </div>
      <div class="dos">
        <div class="card"><div class="card-c"><h2>Ventas por día</h2><span class="mut peq">Últimos 30 días</span></div>
          <div class="graf">${[0, 0.5, 1].map((g) => `<div class="gl" style="bottom:${g * 100}%"><span>${(tope * g).toLocaleString("es-ES")} €</span></div>`).join("")}
            ${dias.map(([f, v]) => `<div class="b ${f === hoy() ? "hoy" : ""} ${v ? "" : "cero"}" style="height:${(v / tope) * 100}%" data-tip="${esc(EMM.fechaCorta(f))} · ${esc(eur(v))}"></div>`).join("")}</div>
          <div class="graf-x">${dias.map(([f], i) => `<span>${f === hoy() ? "hoy" : i % 5 === 0 ? new Date(f + "T12:00:00").getDate() : ""}</span>`).join("")}</div></div>
        <div class="card"><div class="card-c"><h2>Servicios más vendidos</h2><span class="mut peq">30 días</span></div>
          ${servicios.length ? servicios.map(([n, c]) => `<div class="top-s"><span>${esc(n)}</span><b>${c}</b><span class="barra"><i style="width:${(c / maxS) * 100}%"></i></span></div>`).join("") : '<div class="vacio">Sin ventas de servicios.</div>'}</div>
      </div>`;
  }

  /* ───────── Acciones (un solo escuchador para toda la página) ───────── */
  const ACC = {
    cerrar: () => dlg.close(),
    nuevaCita: () => abrirNuevaCita(),
    guardarCita: () => guardarCita(),
    recibir: (d) => abrirRecibir(d.id),
    confRecibir: (d) => confirmarRecibir(d.id),
    verCita: (d) => abrirCita(d.id),
    cancelarCita: (d, el) => {
      if (!el.dataset.seguro) { el.dataset.seguro = "1"; el.textContent = "Sí, cancelar la cita"; el.className = "btn btn-rojo izq"; if (dlgEstado) dlgEstado.confirmando = true; return; }
      const c = st().citas.find((x) => x.id === d.id);
      dlg.close();
      EMM.cancelarCita(d.id);
      toast(c && c.socioId ? "Cita cancelada. El socio recibe el aviso en la app." : "Cita cancelada.");
    },
    mover: (d) => mover(d.id, d.a),
    semana: (d) => { semana = d.v === "0" ? 0 : semana + Number(d.v); render(); },
    verSocio: (d) => abrirSocio(d.id),
    ajustar: (d) => {
      const n = parseInt($("#ajN").value, 10), motivo = $("#ajM").value.trim();
      if (!n) return toast("Escribe los puntos a sumar o restar (p. ej. 50 o −50).", true);
      const s = EMM.socio(d.id);
      if (!s) return;
      const nombre = primerNombre(s.nombre), nivelAntes = EMM.nivel(s).n;
      // El núcleo devuelve los puntos que de verdad cambiaron (no se baja de 0)
      const real = EMM.ajustarPuntos(d.id, n, motivo || "ajuste manual");
      if (!real) return toast(`${nombre} no tiene puntos que quitar`, true);
      const sx = EMM.socio(d.id), nivelAhora = sx ? EMM.nivel(sx).n : nivelAntes;
      const txt = `${real > 0 ? "+" : "−"}${Math.abs(real)} puntos para ${nombre}`;
      if (real !== n) toast(`${txt} (no tenía más)`);
      else if (nivelAhora !== nivelAntes) toast(`${txt}: sube a ${nivelAhora} y le llega el aviso a la app`);
      else toast(txt);
    },
    stock: (d) => { const p = EMM.producto(d.id); if (p) EMM.guardarProducto(p.id, { stock: Math.max(0, p.stock + Number(d.v)) }); },
    pedir: (d) => { const p = EMM.producto(d.id); pedidosProveedor.add(d.id); render(); toast(`Añadido al pedido del proveedor: ${p ? p.n : ""}`); },
    entregarPedido: (d) => { EMM.entregarPedido(d.id); toast("Pedido entregado al socio."); },
    guardarBono: () => {
      const b = Number($("#bono").value);
      if (!(b >= 0 && b <= 50)) return toast("El bono tiene que estar entre 0 y 50 %.", true);
      EMM.guardarConfig({ bonoRecarga: Math.round(b) });
      toast(`Bono de recarga: ahora un ${Math.round(b)} % de regalo`);
    },
    plantilla: (d) => { const t = $("#ofTexto"); t.value = PLANTILLAS[Number(d.i)].t; previaOferta(); t.focus(); },
    enviarOferta: () => {
      const t = $("#ofTexto"), texto = t.value.trim();
      if (!texto) return toast("Escribe la oferta antes de enviarla.", true);
      const n = st().socios.length;
      t.value = "";
      EMM.enviarOferta(texto);
      toast(`Enviada a ${n} socios: les llega a la app`);
    },
    reiniciar: () => abrirDlg(`<h3>Reiniciar la demo</h3><p class="mut">Se borran los cambios (citas, cobros, puntos, ofertas…) y vuelven los datos de ejemplo en la app, el TPV y esta pantalla.</p>
      <div class="dlg-acc"><button class="btn btn-ghost" data-acc="cerrar">Cancelar</button><button class="btn btn-rojo" data-acc="confReiniciar">Reiniciar</button></div>`, { tipo: "reiniciar" }),
    confReiniciar: () => {
      dlg.close();
      EMM.reiniciar();
      // Se recarga todo para que ninguna pantalla se quede con algo a medias (p. ej. un ticket del TPV).
      // Dentro de la portada (iframe) se recarga la página de arriba, igual que su botón «Reiniciar demo».
      try { if (window.parent !== window) { window.parent.location.reload(); return; } } catch (e) { /* portada de otro origen: recargar solo esta */ }
      location.reload();
    },
  };
  document.addEventListener("click", (e) => {
    const nota = e.target.closest("[data-nota]");
    if (nota) { const t = $("#rcNo"); t.value = (t.value.trim() ? t.value.trim() + ". " : "") + nota.dataset.nota; return; }
    const aj = e.target.closest("[data-aj]");
    if (aj) { $("#ajN").value = aj.dataset.aj; return; }
    const el = e.target.closest("[data-acc]");
    if (!el || el.disabled) return;
    const f = ACC[el.dataset.acc];
    if (!f) return;
    e.preventDefault();
    f(el.dataset, el, e);
  });

  /* ───────── Arranque ───────── */
  window.addEventListener("hashchange", () => { seccion = leerSeccion(); render(); window.scrollTo(0, 0); });
  EMM.alCambiar(() => { pintar(); refrescarDlg(); });
  setInterval(() => { pintarReloj(); pintar(); }, 60000); // tiempos en taller y línea de «ahora»
  render();
})();
</script>
</body>
</html>
